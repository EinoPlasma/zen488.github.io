<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator - Free Online Tool</title>
  <meta name="description" content="Generate a random number between any two values instantly. Free online random number generator tool, no sign-up required.">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; background: #fff; }
    h1 { font-size: 1.8rem; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; margin-top: 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 16px; width: 100%; padding: 12px; font-size: 1rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .result { margin-top: 20px; font-size: 3rem; font-weight: 700; text-align: center; }
    .note { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Random Number Generator</h1>
  <p>Enter a minimum and maximum number, then click generate. Free to use, no sign-up required.</p>
  <div class="card">
    <label for="min">Minimum</label>
    <input type="number" id="min" value="1">
    <label for="max">Maximum</label>
    <input type="number" id="max" value="100">
    <button id="generate">Generate</button>
    <div class="result" id="result" aria-live="polite">-</div>
  </div>
  <p class="note">This is a simple demo page used to practice the independent-site workflow.</p>
  <script>
    document.getElementById('generate').addEventListener('click', function () {
      const min = Math.ceil(Number(document.getElementById('min').value || 1));
      const max = Math.floor(Number(document.getElementById('max').value || 100));
      if (min > max) {
        document.getElementById('result').textContent = 'Min must be <= Max';
        return;
      }
      const n = Math.floor(Math.random() * (max - min + 1)) + min;
      document.getElementById('result').textContent = n;
    });
  </script>
</body>
</html>
